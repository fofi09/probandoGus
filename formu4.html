<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Repartidor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
          display: flex;
          width: 520px;
          height: 500px;
          max-width: 99%;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          background-color: #ffffff25;
          border-radius: 15px;
          box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.03);
          border: 0.1px solid rgba(128, 128, 128, 0.178);
        }

        .left {
          width: 66%;
          height: 100%;
        }

        .form {
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 100%;
          width: 100%;
          left: 0;
          backdrop-filter: blur(20px);
          position: relative;
        }

        .form::before {
          position: absolute;
          content: "";
          width: 40%;
          height: 40%;
          right: 1%;
          z-index: -1;
          background: radial-gradient(
            circle,
            rgb(194, 13, 170) 20%,
            rgb(26, 186, 235) 60%,
            rgb(26, 186, 235) 100%
          );
          filter: blur(70px);
          border-radius: 50%;
        }

        .container::after {
          position: absolute;
          content: "";
          width: 80%;
          height: 80%;
          right: -40%;
          background: rgb(157, 173, 203);
          background: radial-gradient(
            circle,
            rgba(157, 173, 203, 1) 61%,
            rgba(99, 122, 159, 1) 100%
          );
          border-radius: 50%;
          z-index: -1;
        }

        .right {
          width: 34%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
        }

        /* Soporte para la etiqueta picture */
        picture {
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .img {
          width: 100%;
          height: auto;
          max-height: 80%;
          object-fit: contain;
          filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.1));
        }

        .input,
        button {
          background: rgba(253, 253, 253, 0);
          outline: none;
          border: 1px solid rgba(255, 0, 0, 0);
          border-radius: 0.5rem;
          padding: 10px;
          margin: 10px auto;
          width: 80%;
          display: block;
          color: #425981;
          font-weight: 500;
          font-size: 1.1em;
        }

        .input-block {
          position: relative;
        }

        label {
          position: absolute;
          left: 15%;
          top: 37%;
          pointer-events: none;
          color: gray;
          transition: all 0.3s ease;
        }

        .forgot {
          display: block;
          margin: 5px 0 10px 0;
          margin-left: 35px;
          color: #5e7eb6;
          font-size: 0.9em;
        }

        .input:focus + label,
        .input:not(:placeholder-shown) + label {
          transform: translateY(-120%) scale(0.9);
          transition: all 0.4s;
        }

        button {
          background-color: #5e7eb6;
          color: white;
          font-size: medium;
          box-shadow: 2px 4px 8px rgba(70, 70, 70, 0.178);
          cursor: pointer;
        }
        
        button:hover {
          background-color: #4d689b;
        }

        a {
          color: #5e7eb6;
          text-decoration: none;
        }

        a:hover {
          text-decoration: underline;
        }

        .input {
          box-shadow: inset 4px 4px 4px rgba(165, 163, 163, 0.315),
            4px 4px 4px rgba(218, 218, 218, 0.13);
          background-color: rgba(255, 255, 255, 0.5);
        }

        /* --- NUEVO: Estilos para el error personalizado --- */
        .error-tooltip {
          position: absolute;
          top: -10px; /* Modificado: de bottom a top para que aparezca arriba del input */
          left: 12%;
          color: #160234;
          font-size: 0.75em;
          font-weight: 600;
          pointer-events: none;
          animation: agitar 0.4s ease-in-out;
        }

        .input.error-shake {
          border-color: rgba(216, 69, 69, 0.5) !important;
        }

        @keyframes agitar {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-4px); }
          75% { transform: translateX(4px); }
        }
        /* -------------------------------------------------- */

        @media (max-width: 600px) {
            .left {
                /* Le quitamos un 6% a la izquierda para darselo a la imagen */
                width: 60%; 
            }
            .right {
                /* Aumentamos el espacio a la izquierda (20px) para separar la imagen de los inputs y centrarla mejor */
                width: 40%;
                padding: 5px 5px 5px 20px; 
            }
            .input, button {
                /* Agrandamos sutilmente los inputs para que aprovechen su nuevo espacio */
                width: 90%; 
                margin: 8px auto;
            }
            label {
                /* Alineamos los textos con el nuevo tamaño del input */
                left: 10%;
                font-size: 0.95em;
            }
            .img {
                /* Permitimos que la imagen sea un toque más grande verticalmente si la nueva imagen es alta */
                max-height: 90%; 
            }
        }
    </style>
</head>
<body>

  <div class="container">
        <div class="left">
            <!-- Modificado: Llamamos a la función enviarWhatsApp() en lugar de solo event.preventDefault() -->
            <form class="form" onsubmit="enviarWhatsApp(event)">
                <div class="input-block">
                    <!-- Modificado: Agregados oninvalid (cuando hay error) y oninput (cuando escribes) -->
                    <input class="input" type="text" id="nombre" placeholder=" " required="" oninvalid="mostrarError(event)" oninput="limpiarError(event)">
                    <label for="nombre">Nombre</label>
                </div>
                <div class="input-block">
                    <!-- Modificado: El texto aparece al hacer clic (onfocus) y se borra si no escriben nada (onblur) -->
                    <input class="input" type="text" id="consulta" placeholder=" " onfocus="if(this.value==='') this.value='Quiero consultar sobre sus servicios '" onblur="if(this.value==='Buenas, quiero consultar sobre.. ') this.value=''">
                    <label for="consulta">Consulta</label>
                </div>
                <div class="input-block">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
        
        <div class="right">
            <!-- La etiqueta <picture> permite tener una imagen distinta para celulares -->
            <picture>
                <!-- 1. IMAGEN PARA CELULARES: Cambia el 'srcset' por tu imagen para móviles -->
                <source media="(max-width: 600px)" srcset="formJG3_inspyrenet.png">
                
                <!-- 2. IMAGEN ORIGINAL PARA PC Y TABLET: Esta es la que ya tenías -->
                <img class="img" src="formJG3_inspyrenet.png" alt="Tu imagen personal">
            </picture>
        </div>
  </div>

  <script>
      // --- NUEVO: Función para mostrar nuestro error bonito ---
      function mostrarError(event) {
          event.preventDefault(); // Apagamos el cartel feo por defecto del navegador
          
          const input = event.target;
          const container = input.parentElement;
          
          // Verificamos que no haya ya un mensaje de error para no duplicarlo
          if (!container.querySelector('.error-tooltip')) {
              const errorMsg = document.createElement('span');
              errorMsg.className = 'error-tooltip';
              errorMsg.innerText = 'Debe ingresar su nombre';
              
              container.appendChild(errorMsg);
              input.classList.add('error-shake'); // Activamos el borde rojo
          }
      }

      // --- NUEVO: Función para borrar el error apenas el usuario escribe ---
      function limpiarError(event) {
          const input = event.target;
          const container = input.parentElement;
          const errorMsg = container.querySelector('.error-tooltip');
          
          if (errorMsg) {
              errorMsg.remove();
              input.classList.remove('error-shake'); // Quitamos el borde rojo
          }
      }

      function enviarWhatsApp(event) {
          // Prevenimos que la página se recargue al presionar el botón
          event.preventDefault();
          
          // Capturamos los valores de los inputs
          const nombre = document.getElementById('nombre').value;
          let consulta = document.getElementById('consulta').value;
          
          // NUEVO: Si la consulta está vacía (nunca le hicieron clic), le asignamos el texto por defecto
          if (consulta.trim() === '') {
              consulta = 'Quiero consultar sobre sus servicios ';
          }
          
          // Construimos el mensaje final
          const mensaje = `Buenas, soy ${nombre}. ${consulta}`;
          
          // Número de teléfono sin el signo + ni espacios, tal cual pide WhatsApp (54 9 3815392765)
          const telefono = "5493815392765";
          
          // Creamos el link de WhatsApp con el texto codificado para URL
          const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
          
          // Abrimos WhatsApp en una pestaña nueva
          window.open(urlWhatsApp, '_blank');
      }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Repartidor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Modificado: Recuperamos el hermoso degradado de fondo, pero de Blanco a Blanco Hielo */
            background: linear-gradient(135deg, #ffffff 0%, #dbe4ed 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
          display: flex;
          width: 520px;
          height: 500px;
          max-width: 99%;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          background-color: #ffffff25;
          border-radius: 15px;
          box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.03);
          border: 0.1px solid rgba(128, 128, 128, 0.178);
        }

        .left {
          width: 66%;
          height: 100%;
        }

        .form {
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 100%;
          width: 100%;
          left: 0;
          backdrop-filter: blur(20px);
          position: relative;
        }

        .form::before {
          position: absolute;
          content: "";
          width: 40%;
          height: 40%;
          right: 1%;
          z-index: -1;
          /* Modificado: Recuperamos el degradado de la mancha de atrás del form, usando tu color y blanco hielo */
          background: radial-gradient(
            circle,
            #ffffff 10%,
            #a8c1d9 50%,
            #8da9c4 100%
          );
          filter: blur(70px);
          border-radius: 50%;
        }

        .container::after {
          position: absolute;
          content: "";
          width: 80%;
          height: 80%;
          right: -40%;
          /* Modificado: Ajustamos los porcentajes para que el #8da9c4 predomine mucho más */
          background: linear-gradient(135deg, #1d4ed8 0%, #8da9c4 40%, #8da9c4 100%);
          border-radius: 50%;
          z-index: -1;
        }

        .right {
          width: 34%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
        }

        /* Soporte para la etiqueta picture */
        picture {
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .img {
          width: 100%;
          height: auto;
          max-height: 80%;
          object-fit: contain;
          filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.1));
        }

        .input,
        button {
          background: rgba(253, 253, 253, 0);
          outline: none;
          border: 1px solid rgba(255, 0, 0, 0);
          border-radius: 0.5rem;
          padding: 10px;
          margin: 10px auto;
          width: 80%;
          display: block;
          /* Modificado: Color del texto oscuro pero en tono azulado/gris */
          color: #425981;
          font-weight: 500;
          font-size: 1.1em;
        }

        .input-block {
          position: relative;
        }

        label {
          position: absolute;
          left: 15%;
          top: 37%;
          pointer-events: none;
          color: gray;
          transition: all 0.3s ease;
        }

        .forgot {
          display: block;
          margin: 5px 0 10px 0;
          margin-left: 35px;
          color: #8da9c4; /* Tu color */
          font-size: 0.9em;
        }

        .input:focus + label,
        .input:not(:placeholder-shown) + label {
          transform: translateY(-120%) scale(0.9);
          transition: all 0.4s;
        }

        button {
          /* Modificado: Botón con degradado (blue-700 a #8da9c4) */
          background: linear-gradient(135deg, #1d4ed8 0%, #8da9c4 100%);
          color: white;
          font-size: medium;
          box-shadow: 2px 4px 8px rgba(70, 70, 70, 0.178);
          cursor: pointer;
        }
        
        button:hover {
          /* Un poquito más oscuro al pasar el mouse para el efecto clic */
          background: linear-gradient(135deg, #1e40af 0%, #7a98b5 100%);
        }

        a {
          color: #8da9c4; /* Tu color */
          text-decoration: none;
        }

        a:hover {
          text-decoration: underline;
        }

        .input {
          box-shadow: inset 4px 4px 4px rgba(165, 163, 163, 0.315),
            4px 4px 4px rgba(218, 218, 218, 0.13);
          background-color: rgba(255, 255, 255, 0.5);
        }

        /* --- NUEVO: Estilos para el error personalizado --- */
        .error-tooltip {
          position: absolute;
          top: -10px; 
          left: 12%;
          color: #160234;
          font-size: 0.75em;
          font-weight: 600;
          pointer-events: none;
          animation: agitar 0.4s ease-in-out;
        }

        .input.error-shake {
          border-color: rgba(216, 69, 69, 0.5) !important;
        }

        @keyframes agitar {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-4px); }
          75% { transform: translateX(4px); }
        }
        /* -------------------------------------------------- */

        @media (max-width: 600px) {
            .left {
                width: 60%; 
            }
            .right {
                width: 40%;
                padding: 5px 5px 5px 20px; 
            }
            .input, button {
                width: 90%; 
                margin: 8px auto;
            }
            label {
                left: 10%;
                font-size: 0.95em;
            }
            .img {
                max-height: 90%; 
            }
        }
    </style>
</head>
<body>

  <div class="container">
        <div class="left">
            <form class="form" onsubmit="enviarWhatsApp(event)">
                <div class="input-block">
                    <input class="input" type="text" id="nombre" placeholder=" " required="" oninvalid="mostrarError(event)" oninput="limpiarError(event)">
                    <label for="nombre">Nombre</label>
                </div>
                <div class="input-block">
                    <input class="input" type="text" id="consulta" placeholder=" " onfocus="if(this.value==='') this.value='Quiero consultar sobre sus servicios '" onblur="if(this.value==='Buenas, quiero consultar sobre.. ') this.value=''">
                    <label for="consulta">Consulta</label>
                </div>
                <div class="input-block">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
        
        <div class="right">
            <picture>
                <source media="(max-width: 600px)" srcset="formJG3_inspyrenet.png">
                <img class="img" src="formJG3_inspyrenet.png" alt="Tu imagen personal">
            </picture>
        </div>
  </div>

  <script>
      function mostrarError(event) {
          event.preventDefault(); 
          
          const input = event.target;
          const container = input.parentElement;
          
          if (!container.querySelector('.error-tooltip')) {
              const errorMsg = document.createElement('span');
              errorMsg.className = 'error-tooltip';
              errorMsg.innerText = 'Debe ingresar su nombre';
              
              container.appendChild(errorMsg);
              input.classList.add('error-shake'); 
          }
      }

      function limpiarError(event) {
          const input = event.target;
          const container = input.parentElement;
          const errorMsg = container.querySelector('.error-tooltip');
          
          if (errorMsg) {
              errorMsg.remove();
              input.classList.remove('error-shake'); 
          }
      }

      function enviarWhatsApp(event) {
          event.preventDefault();
          
          const nombre = document.getElementById('nombre').value;
          let consulta = document.getElementById('consulta').value;
          
          if (consulta.trim() === '') {
              consulta = 'Quiero consultar sobre sus servicios ';
          }
          
          const mensaje = `Buenas, soy ${nombre}. ${consulta}`;
          
          const telefono = "5493815392765";
          
          const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
          
          window.open(urlWhatsApp, '_blank');
      }
  </script>
</body>
</html>

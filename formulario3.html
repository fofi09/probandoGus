<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Repartidor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
          display: flex;
          width: 520px;
          height: 500px;
          max-width: 99%;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          background-color: #ffffff25;
          border-radius: 15px;
          box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.03);
          border: 0.1px solid rgba(128, 128, 128, 0.178);
        }

        .left { width: 66%; height: 100%; }

        .form {
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 100%;
          width: 100%;
          backdrop-filter: blur(20px);
          position: relative;
        }

        .right {
          width: 34%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
        }

        .img {
          width: 100%;
          height: auto;
          max-height: 80%;
          object-fit: contain;
          filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.1));
        }

        .input-block { position: relative; margin: 8px 0; }

        .input {
          background: rgba(255, 255, 255, 0.5);
          outline: none;
          border: 1px solid rgba(255, 255, 255, 0.3);
          border-radius: 0.5rem;
          padding: 12px;
          width: 80%;
          display: block;
          margin: 0 auto;
          color: #425981;
          font-weight: 500;
          box-shadow: inset 2px 2px 5px rgba(165, 163, 163, 0.2);
        }

        label {
          position: absolute;
          left: 15%;
          top: 30%;
          pointer-events: none;
          color: gray;
          transition: all 0.3s ease;
          font-size: 0.9em;
        }

        .input:focus + label, .input:valid + label {
          transform: translateY(-130%) scale(0.9);
        }

        button {
          background-color: #5e7eb6;
          color: white;
          border: none;
          border-radius: 0.5rem;
          padding: 12px;
          width: 80%;
          margin: 15px auto;
          cursor: pointer;
          font-size: 1em;
          box-shadow: 2px 4px 8px rgba(70, 70, 70, 0.178);
        }
    </style>
</head>
<body>

  <div class="container">
        <div class="left">
            <form class="form" id="contactForm">
                <div class="input-block">
                    <input class="input" type="text" id="nombre" required>
                    <label for="nombre">Nombre</label>
                </div>
                <div class="input-block">
                    <input class="input" type="email" id="email" required>
                    <label for="email">Email</label>
                </div>
                <div class="input-block">
                    <input class="input" type="text" id="consulta" required>
                    <label for="consulta">Consulta</label>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
        <div class="right">
            <img class="img" src="https://cdn-icons-png.flaticon.com/512/3063/3063823.png" alt="Repartidor">
        </div>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const email = document.getElementById('email').value;
        const consulta = document.getElementById('consulta').value;
        
        // REEMPLAZA 1234567890 POR TU NUMERO DE WHATSAPP (SIN EL + NI GUIONES)
        const telefono = "1234567890"; 
        
        const mensaje = `Hola, mi nombre es ${nombre}. Mi email es ${email}. Consulta: ${consulta}`;
        const url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
        
        window.open(url, '_blank');
    });
  </script>
</body>
</html>

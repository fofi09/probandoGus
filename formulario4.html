<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Repartidor Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
          display: flex;
          width: 520px;
          height: 500px;
          max-width: 99%;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          background-color: #ffffff25;
          border-radius: 15px;
          box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.03);
          border: 0.1px solid rgba(128, 128, 128, 0.178);
        }

        .left {
          width: 66%;
          height: 100%;
        }

        .form {
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 100%;
          width: 100%;
          left: 0;
          backdrop-filter: blur(20px);
          position: relative;
        }

        .form::before {
          position: absolute;
          content: "";
          width: 40%;
          height: 40%;
          right: 1%;
          z-index: -1;
          background: radial-gradient(
            circle,
            rgb(194, 13, 170) 20%,
            rgb(26, 186, 235) 60%,
            rgb(26, 186, 235) 100%
          );
          filter: blur(70px);
          border-radius: 50%;
        }

        .right {
          width: 34%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
        }

        .img {
          width: 100%;
          height: auto;
          max-height: 80%;
          object-fit: contain;
          filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.1));
        }

        .container::after {
          position: absolute;
          content: "";
          width: 80%;
          height: 80%;
          right: -40%;
          background: rgb(157, 173, 203);
          background: radial-gradient(
            circle,
            rgba(157, 173, 203, 1) 61%,
            rgba(99, 122, 159, 1) 100%
          );
          border-radius: 50%;
          z-index: -1;
        }

        .input,
        button {
          background: rgba(253, 253, 253, 0);
          outline: none;
          border: 1px solid rgba(255, 0, 0, 0);
          border-radius: 0.5rem;
          padding: 10px;
          margin: 10px auto;
          width: 80%;
          display: block;
          color: #425981;
          font-weight: 500;
          font-size: 1.1em;
        }

        .input-block {
          position: relative;
        }

        label {
          position: absolute;
          left: 15%;
          top: 37%;
          pointer-events: none;
          color: gray;
          transition: all 0.3s ease;
        }

        /* Se mantiene la clase forgot por si la necesitas en el futuro, aunque no se usa en el HTML ahora */
        .forgot {
          display: block;
          margin: 5px 0 10px 0;
          margin-left: 35px;
          color: #5e7eb6;
          font-size: 0.9em;
        }

        .input:focus + label,
        .input:not(:placeholder-shown) + label {
          transform: translateY(-120%) scale(0.9);
          transition: all 0.4s;
        }

        button {
          background-color: #5e7eb6;
          color: white;
          font-size: medium;
          box-shadow: 2px 4px 8px rgba(70, 70, 70, 0.178);
          cursor: pointer;
        }
        
        button:hover {
          background-color: #4d689b;
        }

        a {
          color: #5e7eb6;
          text-decoration: none;
        }

        a:hover {
          text-decoration: underline;
        }

        .input {
          box-shadow: inset 4px 4px 4px rgba(165, 163, 163, 0.315),
            4px 4px 4px rgba(218, 218, 218, 0.13);
          background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

  <div class="container">
        <div class="left">
            <form class="form" onsubmit="event.preventDefault();">
                <div class="input-block">
                    <!-- Primer input: Nombre -->
                    <input class="input" type="text" id="nombre" placeholder=" " required="">
                    <label for="nombre">Nombre</label>
                </div>
                <div class="input-block">
                    <!-- Segundo input: Consulta (sin atributo 'required' para que sea opcional) -->
                    <input class="input" type="text" id="consulta" placeholder=" ">
                    <label for="consulta">Consulta (opcional)</label>
                </div>
                <div class="input-block">
                    <!-- El link de contraseña olvidada fue removido y el botón ahora dice "Enviar" -->
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
        <div class="right">
            <!-- Imagen original conservada -->
            <img class="img" src="https://cdn-icons-png.flaticon.com/512/3063/3063823.png" alt="Repartidor de encomiendas">
        </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargador de Camión - Animación Personalizada</title>
  <style>
    /* Estilos del lienzo principal */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* * Basado en el componente original de Uiverse.io por vinodjangid07
     * Bajo licencia MIT (Copyright 2026 vinodjangid07)
     */

    /* Contenedor principal del loader */
    .loader {
      width: fit-content;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .truckWrapper {
      width: 260px;
      height: 120px;
      display: flex;
      flex-direction: column;
      position: relative;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      background: transparent;
      border-radius: 0;
      border: none;
    }

    /* Siluetas de casas y edificios en el fondo (Efecto Parallax Continuo) */
    .cityBackground {
      position: absolute;
      bottom: 2px;
      left: 0;
      height: 60px;
      display: flex;
      align-items: flex-end;
      width: max-content;
      animation: cityAnimation 6s linear infinite;
      opacity: 0.35;
      z-index: 1;
    }

    .cityBackground svg {
      height: 100%;
      fill: #475569;
    }

    /* Desplazamiento exacto del 50% para bucle infinito continuo */
    @keyframes cityAnimation {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* Camión - Parte Superior */
    .truckBody {
      width: 130px;
      height: fit-content;
      margin-bottom: 6px;
      animation: motion 1s linear infinite;
      z-index: 3;
    }

    /* Animación de suspensión del camión */
    @keyframes motion {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(3px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* Llantas del camión */
    .truckTires {
      width: 130px;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0px 10px 0px 15px;
      position: absolute;
      bottom: 0;
      z-index: 4;
    }
    .truckTires svg {
      width: 24px;
    }

    /* Carretera */
    .road {
      width: 100%;
      height: 2px;
      background-color: #282828;
      position: relative;
      bottom: 0;
      align-self: flex-end;
      z-index: 4;
    }
    .road::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 100%;
      background-color: #282828;
      right: -50%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 10px solid white;
    }
    .road::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 100%;
      background-color: #282828;
      right: -65%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 4px solid white;
    }

    @keyframes roadAnimation {
      0% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(-350px);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Basado en Uiverse.io por vinodjangid07 -->

              rx="1"

              width="5"
              y="63"
              x="187"
            ></rect>
            <!-- Parachoques -->
            <rect
              stroke-width="2"
              stroke="#282828"
              fill="#282828"
              rx="1"
              height="11"
              width="4"
              y="81"
              x="193"

            <!-- Carga trasera -->
            <rect
              stroke-width="3"
              stroke="#282828"
              fill="#DFDFDF"
              rx="2.5"
              height="90"
              width="121"
              y="1.5"

            <rect
              stroke-width="2"
              stroke="#282828"
              fill="#DFDFDF"
              rx="2"
              height="4"
              width="6"
              y="84"
              x="1"

          </svg>
        </div>

        <!-- Llantas -->
        <div class="truckTires">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30" class="tiresvg">
            <circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"></circle>
            <circle fill="#DFDFDF" r="7" cy="15" cx="15"></circle>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30" class="tiresvg">
            <circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"></circle>
            <circle fill="#DFDFDF" r="7" cy="15" cx="15"></circle>
          </svg>
        </div>

        <!-- Carretera -->
        <div class="road"></div>

      </div>
    </div>
  </div>

</body>
</html>

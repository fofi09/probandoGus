<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JG Envíos - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow-x: hidden; background-color: #f3f4f6; margin: 0; padding: 0; }

        /* Loader */
        #loader-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #f0f0f0; z-index: 50; transition: opacity 0.5s ease, transform 0.5s ease; }
        .loader { width: fit-content; height: fit-content; display: flex; align-items: center; justify-content: center; }
        .truckWrapper { width: 260px; height: 120px; display: flex; flex-direction: column; position: relative; align-items: center; justify-content: flex-end; overflow: hidden; }
        .cityBackground { position: absolute; bottom: 2px; left: 0; height: 60px; display: flex; align-items: flex-end; width: max-content; animation: cityAnimation 6s linear infinite; opacity: 0.35; z-index: 1; }
        .cityBackground svg { height: 100%; fill: #475569; }
        @keyframes cityAnimation { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .truckBody { width: 130px; height: fit-content; margin-bottom: 6px; animation: motion 1s linear infinite; z-index: 3; }
        @keyframes motion { 0% { transform: translateY(0px); } 50% { transform: translateY(3px); } 100% { transform: translateY(0px); } }
        .truckTires { width: 130px; height: fit-content; display: flex; align-items: center; justify-content: space-between; padding: 0px 10px 0px 15px; position: absolute; bottom: 0; z-index: 4; }
        .truckTires svg { width: 24px; }
        .road { width: 100%; height: 2px; background-color: #282828; position: relative; bottom: 0; align-self: flex-end; z-index: 4; }
        .road::before { content: ""; position: absolute; width: 20px; height: 100%; background-color: #282828; right: -50%; border-radius: 3px; animation: roadAnimation 1.4s linear infinite; border-left: 10px solid white; }
        .road::after { content: ""; position: absolute; width: 10px; height: 100%; background-color: #282828; right: -65%; border-radius: 3px; animation: roadAnimation 1.4s linear infinite; border-left: 4px solid white; }
        @keyframes roadAnimation { 0% { transform: translateX(0px); } 100% { transform: translateX(-350px); } }
        .loader-hidden { opacity: 0; visibility: hidden; transform: translateY(-20px); pointer-events: none; }

        #main-content { opacity: 0; visibility: hidden; transition: opacity 0.8s ease-in 0.2s; }
        #main-content.visible { opacity: 1; visibility: visible; }
        @keyframes slideInFromLeft { 0% { transform: translateX(-150%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes slideInFromRight { 0% { transform: translateX(150%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .start-animations .anim-jg-envios { animation: slideInFromLeft 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .start-animations .anim-bienvenido { opacity: 0; animation: slideInFromRight 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s forwards; }
        .start-animations .anim-fade-in { opacity: 0; animation: fadeIn 1s ease-in 1.5s forwards; }
        @media (max-width: 767px) { .start-animations .mobile-overlay-anim { animation: dimOverlay 1.5s ease-out 0.5s forwards; } }
        @keyframes dimOverlay { 0% { background-color: rgba(0, 0, 0, 0); } 100% { background-color: rgba(0, 0, 0, 0.5); } }
        .hero-image-bg { background-image: url('verticalHero1.png'); background-size: cover; background-position: center; background-repeat: no-repeat; }
        @media (min-width: 768px) { .hero-image-bg { background-image: url('jghero3.jpg'); } }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="loader">
            <div class="truckWrapper">
                <div class="cityBackground">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80"><rect x="10" y="35" width="30" height="35"/><polygon points="5,35 25,15 45,35"/><rect x="50" y="20" width="25" height="50"/><rect x="85" y="40" width="35" height="30"/><polygon points="80,40 102,20 125,40"/><rect x="130" y="15" width="30" height="55"/><rect x="170" y="38" width="28" height="32"/><polygon points="165,38 184,22 203,38"/><rect x="210" y="5" width="35" height="65"/><rect x="255" y="35" width="32" height="35"/><polygon points="250,35 271,18 292,35"/><rect x="300" y="25" width="28" height="45"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80"><rect x="10" y="35" width="30" height="35"/><polygon points="5,35 25,15 45,35"/><rect x="50" y="20" width="25" height="50"/><rect x="85" y="40" width="35" height="30"/><polygon points="80,40 102,20 125,40"/><rect x="130" y="15" width="30" height="55"/><rect x="170" y="38" width="28" height="32"/><polygon points="165,38 184,22 203,38"/><rect x="210" y="5" width="35" height="65"/><rect x="255" y="35" width="32" height="35"/><polygon points="250,35 271,18 292,35"/><rect x="300" y="25" width="28" height="45"/></svg>
                </div>
                <div class="truckBody"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 198 93"><path stroke-width="3" stroke="#282828" fill="#2563EB" d="M135 22.5H177.264C178.295 22.5 179.22 23.133 179.594 24.0939L192.33 56.8443C192.442 57.1332 192.5 57.4404 192.5 57.7504V89C192.5 90.3807 191.381 91.5 190 91.5H135C133.619 91.5 132.5 90.3807 132.5 89V25C132.5 23.6193 133.619 22.5 135 22.5Z"/><path stroke-width="3" stroke="#282828" fill="#7D7C7C" d="M146 33.5H181.741C182.779 33.5 183.709 34.1415 184.078 35.112L190.538 52.112C191.16 53.748 189.951 55.5 188.201 55.5H146C144.619 55.5 143.5 54.3807 143.5 53V36C143.5 34.6193 144.619 33.5 146 33.5Z"/><path stroke-width="2" stroke="#282828" fill="#282828" d="M150 65C150 65.39 149.763 65.8656 149.127 66.2893C148.499 66.7083 147.573 67 146.5 67C145.427 67 144.501 66.7083 143.873 66.2893C143.237 65.8656 143 65.39 143 65C143 64.61 143.237 64.1344 143.873 63.7107C144.501 63.2917 145.427 63 146.5 63C147.573 63 148.499 63.2917 149.127 63.7107C149.763 64.1344 150 64.61 150 65Z"/><rect stroke-width="2" stroke="#282828" fill="#FFFCAB" rx="1" height="7" width="5" y="63" x="187"/><rect stroke-width="2" stroke="#282828" fill="#282828" rx="1" height="11" width="4" y="81" x="193"/><rect stroke-width="3" stroke="#282828" fill="#DFDFDF" rx="2.5" height="90" width="121" y="1.5" x="6.5"/><rect stroke-width="2" stroke="#282828" fill="#DFDFDF" rx="2" height="4" width="6" y="84" x="1"/></svg></div>
                <div class="truckTires"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30"><circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"/><circle fill="#DFDFDF" r="7" cy="15" cx="15"/></svg><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 30 30"><circle stroke-width="3" stroke="#282828" fill="#282828" r="13.5" cy="15" cx="15"/><circle fill="#DFDFDF" r="7" cy="15" cx="15"/></svg></div>
                <div class="road"></div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <nav class="fixed top-0 left-0 w-full z-40 bg-white/90 backdrop-blur-sm shadow-md">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <span class="text-2xl font-extrabold text-blue-900">JG<span class="text-orange-500">ENVÍOS</span></span>
                <div class="hidden md:flex space-x-8 font-semibold text-gray-700">
                    <a href="#" class="hover:text-blue-600 transition">Servicios</a>
                    <a href="#" class="hover:text-blue-600 transition">Sobre EnvíosJG</a>
                    <a href="#" class="hover:text-blue-600 transition">Testimonios</a>
                    <a href="#" class="bg-orange-500 text-white px-5 py-2 rounded-full hover:bg-orange-600 transition">Contacto</a>
                </div>
                <button id="menu-btn" class="md:hidden text-gray-700 font-bold text-2xl">☰</button>
            </div>
            <div id="mobile-menu" class="hidden md:hidden bg-white p-4 space-y-4 text-center shadow-lg">
                <a href="#" class="block text-gray-700">Servicios</a>
                <a href="#" class="block text-gray-700">Sobre EnvíosJG</a>
                <a href="#" class="block text-gray-700">Testimonios</a>
                <a href="#" class="block bg-orange-500 text-white py-2 rounded-full">Contacto</a>
            </div>
        </nav>

        <div class="flex justify-center p-0 pt-0">
            <header class="w-full max-w-7xl h-[80vh] min-h-[500px] mt-[72px] bg-white shadow-xl overflow-hidden flex flex-col md:flex-row relative">
            <header class="w-full max-w-7xl h-[80vh] min-h-[500px] bg-white shadow-xl overflow-hidden flex flex-col md:flex-row relative">
                <div class="relative z-10 w-full md:w-[45%] lg:w-[40%] h-full flex flex-col justify-center items-center p-8 md:p-12 lg:p-16 overflow-hidden bg-transparent md:bg-white">
                    <div class="text-center w-full">
                        <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold text-blue-900 tracking-tight anim-jg-envios">JG ENVÍOS</h1>
                        <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-orange-500 mt-4 anim-bienvenido">BIENVENIDO</h2>
                        <p class="mt-6 text-white md:text-gray-600 text-base md:text-lg lg:text-xl anim-fade-in max-w-md mx-auto">Tu logística de encomiendas de confianza. Llegamos a donde necesites.</p>
                        <div class="mt-8 anim-fade-in"><button class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full shadow-lg transition">Cotizar Envío</button></div>
                    </div>
                </div>
                <div class="hero-image-bg absolute inset-0 md:relative md:inset-auto w-full md:w-[55%] lg:w-[60%] h-full z-0">
                    <div class="absolute inset-0 mobile-overlay-anim md:hidden"></div>
                </div>
            </header>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader-container').classList.add('loader-hidden');
                const main = document.getElementById('main-content');
                main.classList.add('visible', 'start-animations');
            }, 2500);
        });
        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Compacto y Equilibrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Eliminamos las restricciones de altura absoluta para que no se rompa en PC */
        body { overflow-x: hidden; }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 8px;
            padding: 0 8px;
            /* Usamos un ancho máximo para que en PC no se vea gigante */
            max-width: 600px;
            margin: 0 auto;
        }

        /* Forzamos al contenedor de la imagen principal a ser cuadrado */
        .main-img-container {
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body class="bg-white p-2">

    <header class="flex justify-between items-center py-2 px-1 max-w-[600px] mx-auto">
        <div class="font-bold text-lg">IconScout</div>
        <button class="bg-gray-100 text-xs px-4 py-1 rounded-full">Acceso</button>
    </header>

    <section class="mt-2">
        <h1 class="text-xl font-bold mb-2 ml-1 text-center sm:text-left max-w-[600px] mx-auto">tendencia</h1>
        
        <div class="grid-layout">
            <!-- Imagen grande izquierda: Cuadrada -->
            <div class="main-img-container bg-blue-50 rounded-lg flex items-center justify-center border shadow-sm">
                [Imagen Principal]
            </div>

            <!-- Columna derecha: 3 pequeñas -->
            <div class="grid grid-rows-3 gap-2">
                <div class="bg-gray-100 rounded flex items-center justify-center border text-[10px] shadow-sm">Img 1</div>
                <div class="bg-gray-100 rounded flex items-center justify-center border text-[10px] shadow-sm">Img 2</div>
                <div class="bg-gray-100 rounded flex items-center justify-center border text-[10px] shadow-sm">Img 3</div>
            </div>
        </div>

        <div class="text-center mt-3">
            <h2 class="font-bold text-sm">Business</h2>
            <p class="text-xs text-gray-400">210,135 Animaciones de Lottie</p>
        </div>
    </section>

</body>
</html>
